{% block toolbar %}
<div class="toolbar" id="normalToolbar">
  <div class="toolbar-left">
    <div class="toolbar-title">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="5" width="20" height="14" rx="2"/>
        <line x1="2" y1="10" x2="22" y2="10"/>
      </svg>
      {{ toolbar_title }}
    </div>
    <span class="toolbar-count" id="entryCount">{{ entry_count_text }}</span>
  </div>
  <div class="toolbar-right">
    <!-- Search -->
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input type="text" class="search-input" placeholder="{{ search_placeholder|default:'Search...' }}" id="searchInput" value="{{ search_query|default:'' }}">
    </div>

    <!-- Clear button (shows when searching) -->
    {% if search_query %}
    <button class="icon-btn" id="clearSearchBtn" title="Clear search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
      Clear
    </button>
    {% endif %}

    <!-- Filter (optional) -->
    {% if show_filter %}
    <select class="filter-select" id="{{ filter_id|default:'filterSelect' }}">
      <option value="">{{ filter_all_text }}</option>
      {% for key, label in filter_options.items %}
        <option value="{{ key }}">{{ label }}</option>
      {% endfor %}
    </select>
    {% endif %}

    <!-- Bulk Delete (optional) -->
    {% if show_bulk_delete %}
    <button class="icon-btn" id="bulkDeleteBtn" title="Delete multiple items">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="3 6 5 6 21 6"/>
        <path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/>
        <path d="M10 11v6"/><path d="M14 11v6"/>
        <path d="M9 6V4a1 1 0 011-1h4a1 1 0 011 1v2"/>
      </svg>
      Delete Bulk
    </button>
    {% endif %}

    <!-- Export -->
    <button class="icon-btn" title="Export data">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
        <polyline points="7 10 12 15 17 10"/>
        <line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
      Export
    </button>
  </div>
</div>

<!-- Search Handler JavaScript -->
<script>
  // Schedule search on input with debounce
  (function() {
    let searchTimeout;
    const searchInput = document.getElementById('searchInput');
    const clearBtn = document.getElementById('clearSearchBtn');
    
    if (searchInput) {
      searchInput.addEventListener('keyup', function(e) {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(function() {
          const query = searchInput.value.trim();
          // Redirect to the current page with search query
          const url = new URL(window.location);
          if (query) {
            url.searchParams.set('q', query);
            url.searchParams.set('page', '1'); // Reset to page 1 when searching
          } else {
            url.searchParams.delete('q');
            url.searchParams.delete('page');
          }
          window.location.href = url.toString();
        }, 500); // 500ms debounce
      });
    }
    
    // Clear search button handler
    if (clearBtn) {
      clearBtn.addEventListener('click', function() {
        const url = new URL(window.location);
        url.searchParams.delete('q');
        url.searchParams.delete('page');
        window.location.href = url.toString();
      });
    }
  })();
</script>
{% endblock %}
