<!-- TOPBAR COMPONENT -->
<header class="topbar">
    <div class="topbar-left">
        <!-- Mobile toggle -->
        <button class="topbar-btn d-md-none" onclick="document.getElementById('sidebar').classList.toggle('show')">
            <i class="bi bi-list"></i>
        </button>
        <!-- Breadcrumb -->
        <div class="breadcrumb-custom">
            <span>DTI APO</span>
            <i class="bi bi-chevron-right" style="font-size: 0.6rem;"></i>
            <span class="page-title">{% block page_title %}Dashboard{% endblock %}</span>
        </div>
    </div>
    <div class="topbar-right">
        <button class="topbar-btn">
            <i class="bi bi-search"></i>
        </button>
        <button class="topbar-btn">
            <i class="bi bi-bell"></i>
            <span class="notif-dot"></span>
        </button>
        <div class="avatar" title="Account">AD</div>
    </div>
</header>
