{% block toolbar %}
<div class="toolbar" id="normalToolbar">
  <div class="toolbar-left">
    <div class="toolbar-title">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="5" width="20" height="14" rx="2"/>
        <line x1="2" y1="10" x2="22" y2="10"/>
      </svg>
      {{ toolbar_title }}
    </div>
    <span class="toolbar-count" id="entryCount">{{ entry_count_text }}</span>
  </div>
  <div class="toolbar-right">
    <form method="get" class="toolbar-search" style="display: flex; align-items: center; gap: 10px;">
      <!-- Search -->
      <div class="search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="text" name="q" class="search-input" placeholder="{{ search_placeholder|default:'Search...' }}" id="searchInput" value="{{ search_query|default:'' }}" autocomplete="off">
      </div>

      <!-- Filter (optional) -->
      {% if show_filter %}
      <select name="status" class="filter-select" id="{{ filter_id|default:'filterSelect' }}">
        <option value="">{{ filter_all_text }}</option>
        {% if filter_options %}
          {% if filter_options.items %}
            {% for key, label in filter_options.items %}
              <option value="{{ key }}" {% if status_filter == key %}selected{% endif %}>{{ label }}</option>
            {% endfor %}
          {% else %}
            {% for option in filter_options %}
              <option value="{{ option.value }}" {% if status_filter == option.value %}selected{% endif %}>{{ option.label }}</option>
            {% endfor %}
          {% endif %}
        {% endif %}
      </select>
      {% endif %}
    </form>

    <!-- Clear button (shown dynamically when searching) -->
    {% if clear_url_name %}
      <a href="{% url clear_url_name %}" class="icon-btn" id="clearSearchBtn" title="Clear search" style="display:none;">
    {% else %}
      <a href="{{ clear_url|default:'#' }}" class="icon-btn" id="clearSearchBtn" title="Clear search" style="display:none;">
    {% endif %}
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
      Clear
    </a>

    <!-- Bulk Delete (optional) -->
    {% if show_bulk_delete %}
    <button class="icon-btn" id="bulkDeleteBtn" title="Delete multiple items">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="3 6 5 6 21 6"/>
        <path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/>
        <path d="M10 11v6"/><path d="M14 11v6"/>
        <path d="M9 6V4a1 1 0 011-1h4a1 1 0 011 1v2"/>
      </svg>
      Delete Bulk
    </button>
    {% endif %}

    <!-- Export -->
    <button class="icon-btn" id="exportBtn" type="button" title="Export data">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
        <polyline points="7 10 12 15 17 10"/>
        <line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
      Export
    </button>
  </div>
</div>

{% endblock %}
